<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ooru – Social Network</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#14213d;--mute:#5d6b82;--line:#dce4e1;--accent:#0f9d8a;--accent-ink:#fff;--warm:#f2a93b}
@media(prefers-color-scheme:dark){:root{--bg:#0e1424;--card:#172038;--ink:#eaf0ff;--mute:#9aa8c4;--line:#27324f;--accent:#2fc4ae;--accent-ink:#06201b}}
*{box-sizing:border-box}
body{margin:0;font-family:Sora,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.hidden{display:none!important}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:.55rem 1.2rem;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:.3rem .9rem;font-size:.85rem}
input,textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:.65rem .8rem}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#14213d;flex:none}
/* auth */
#auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:var(--accent);color:var(--accent-ink);padding:4rem 3rem;display:flex;flex-direction:column;justify-content:center}
.hero h1{font-size:clamp(3rem,9vw,6rem);font-weight:800;margin:0;line-height:1;letter-spacing:-.03em}
.hero p{font-size:1.2rem;max-width:26ch;margin-top:1rem}
.authbox{padding:3rem;display:flex;flex-direction:column;justify-content:center;gap:.8rem;max-width:420px;width:100%;margin:auto}
.authbox h2{margin:0 0 .5rem}
/* app */
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:.7rem 1rem;display:flex;align-items:center;gap:1rem;justify-content:space-between}
.logo{font-weight:800;font-size:1.4rem;letter-spacing:-.02em;color:var(--accent)}
nav{display:flex;gap:.4rem}
nav button{background:none;border:0;padding:.4rem .9rem;border-radius:999px;font-weight:600;color:var(--mute)}
nav button.on{background:var(--bg);color:var(--ink)}
main{max-width:1000px;margin:1.2rem auto;padding:0 1rem;display:grid;grid-template-columns:1fr 280px;gap:1.2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem}
.stack{display:flex;flex-direction:column;gap:1rem}
.row{display:flex;gap:.7rem;align-items:center}
.post .meta{font-size:.85rem;color:var(--mute)}
.post p{margin:.5rem 0;white-space:pre-wrap;word-wrap:break-word}
.tag{color:var(--accent);font-weight:600}
.acts{display:flex;gap:1rem;border-top:1px solid var(--line);padding-top:.5rem;margin-top:.5rem}
.acts button{background:none;border:0;color:var(--mute);padding:.2rem .3rem;font-weight:600}
.acts button.liked{color:#e0475b}
.cmt{background:var(--bg);border-radius:10px;padding:.4rem .7rem;margin-top:.4rem;font-size:.92rem}
.cmtform{display:flex;gap:.5rem;margin-top:.5rem}
.empty{text-align:center;color:var(--mute);padding:2rem}
.who{justify-content:space-between}
aside h3{margin:0 0 .6rem;font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;font-size:.85rem}
.profile-head{display:flex;gap:1rem;align-items:center}
.profile-head .av{width:72px;height:72px;font-size:1.8rem}
#toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1.2rem;border-radius:999px;font-size:.9rem}
@media(max-width:760px){#auth{grid-template-columns:1fr}.hero{padding:2rem 1.5rem}main{grid-template-columns:1fr}aside{order:-1}}
</style>
</head>
<body>

<section id="auth">
  <div class="hero"><h1>Ooru</h1><p>Your town, online. Share, follow and chat with people around you.</p></div>
  <form class="authbox" id="authForm">
    <h2>Join Ooru</h2>
    <label>Your name<input id="aName" required maxlength="30" placeholder="Priya Kumar"></label>
    <label>Username<input id="aUser" required maxlength="15" pattern="[a-zA-Z0-9_]+" placeholder="priya_k" title="Letters, numbers and underscore only"></label>
    <label>Short bio<input id="aBio" maxlength="80" placeholder="Coffee, code and cricket"></label>
    <button class="btn" type="submit">Create account</button>
    <small style="color:var(--mute)">Demo app: your data stays in this browser only.</small>
  </form>
</section>

<div id="app" class="hidden">
  <header>
    <span class="logo">Ooru</span>
    <nav>
      <button id="nHome" class="on">Home</button>
      <button id="nMe">Profile</button>
    </nav>
    <button class="btn ghost small" id="logout">Log out</button>
  </header>
  <main>
    <div class="stack" id="feedCol">
      <div class="card" id="profileCard" class="hidden"></div>
      <form class="card" id="composer">
        <textarea id="postText" rows="3" maxlength="280" placeholder="What's happening in your Ooru? Use #tags"></textarea>
        <div class="row" style="justify-content:space-between;margin-top:.6rem">
          <small id="count" style="color:var(--mute)">0/280</small>
          <button class="btn" type="submit">Post</button>
        </div>
      </form>
      <div class="stack" id="feed"></div>
    </div>
    <aside class="stack">
      <div class="card"><h3>People to follow</h3><div class="stack" id="people" style="gap:.7rem"></div></div>
      <div class="card"><h3>Trending</h3><div class="chips" id="trends"></div></div>
    </aside>
  </main>
</div>
<div id="toast" class="hidden" role="status"></div>

<script>
const KEY='ooru-v1', COLORS=['#f2a93b','#7fd6c6','#f5a3b5','#a8b8ff','#c8e06b','#ffbf8a'];
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=Date.now(), h=3600e3;
const seed=()=>({
  me:null,view:'home',
  users:{
    anbu:{name:'Anbu Selvan',bio:'Chennai | Filter coffee fan',follows:[]},
    meena:{name:'Meena Raj',bio:'Photographer. Madurai',follows:[]},
    karthik:{name:'Karthik S',bio:'Building things with code',follows:[]},
    divya:{name:'Divya Nair',bio:'Books, rain and chai',follows:[]}},
  posts:[
    {id:1,u:'meena',t:'Sunrise at Marina beach this morning. Worth waking up at 5! #chennai #photography',ts:now-2*h,likes:['anbu','divya'],c:[{u:'anbu',t:'Superb shot!'}]},
    {id:2,u:'karthik',t:'Just pushed my first open source project to GitHub 🎉 #coding #github',ts:now-5*h,likes:['meena'],c:[]},
    {id:3,u:'divya',t:'Rainy evening + filter coffee = perfect. What are you all reading? #books #chai',ts:now-9*h,likes:[],c:[{u:'meena',t:'Reading Ponniyin Selvan again!'}]},
    {id:4,u:'anbu',t:'Pongal planning has started. Who is going home this year? #pongal #family',ts:now-26*h,likes:['divya','karthik'],c:[]}]
});
let S; try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){} if(!S)S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const color=u=>COLORS[[...u].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
const av=u=>`<div class="av" style="background:${color(u)}">${esc((S.users[u].name[0]||'?').toUpperCase())}</div>`;
const ago=t=>{const m=Math.floor((Date.now()-t)/6e4);return m<1?'just now':m<60?m+'m ago':m<1440?Math.floor(m/60)+'h ago':Math.floor(m/1440)+'d ago'};
const tags=t=>esc(t).replace(/#(\w+)/g,'<span class="tag">#$1</span>');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.i);toast.i=setTimeout(()=>t.classList.add('hidden'),2000)}

function render(){
  const logged=!!S.me;
  $('#auth').classList.toggle('hidden',logged);$('#app').classList.toggle('hidden',!logged);
  if(!logged)return;
  const me=S.users[S.me], mine=S.view==='me';
  $('#nHome').classList.toggle('on',!mine);$('#nMe').classList.toggle('on',mine);
  const pc=$('#profileCard');pc.classList.toggle('hidden',!mine);
  if(mine)pc.innerHTML=`<div class="profile-head">${av(S.me)}<div><strong style="font-size:1.2rem">${esc(me.name)}</strong><div class="meta" style="color:var(--mute)">@${esc(S.me)}</div><div>${esc(me.bio||'')}</div><small style="color:var(--mute)">${me.follows.length} following · ${Object.values(S.users).filter(u=>u.follows.includes(S.me)).length} followers</small></div></div>`;
  let list=S.posts.slice().sort((a,b)=>b.ts-a.ts);
  list=mine?list.filter(p=>p.u===S.me):list.filter(p=>p.u===S.me||me.follows.includes(p.u)||me.follows.length===0);
  $('#feed').innerHTML=list.length?list.map(postHTML).join(''):'<div class="card empty">Nothing here yet. Write your first post or follow someone.</div>';
  const others=Object.keys(S.users).filter(u=>u!==S.me);
  $('#people').innerHTML=others.map(u=>{const f=me.follows.includes(u);return `<div class="row who"><div class="row">${av(u)}<div><strong>${esc(S.users[u].name)}</strong><div class="meta" style="font-size:.8rem;color:var(--mute)">@${esc(u)}</div></div></div><button class="btn small ${f?'ghost':''}" data-follow="${esc(u)}">${f?'Following':'Follow'}</button></div>`}).join('');
  const cnt={};S.posts.forEach(p=>(p.t.match(/#\w+/g)||[]).forEach(t=>cnt[t.toLowerCase()]=(cnt[t.toLowerCase()]||0)+1));
  $('#trends').innerHTML=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([t,n])=>`<span class="chip">${esc(t)} · ${n}</span>`).join('')||'<span class="empty">No tags yet</span>';
}
function postHTML(p){
  const liked=p.likes.includes(S.me);
  return `<article class="card post" data-id="${p.id}"><div class="row">${av(p.u)}<div><strong>${esc(S.users[p.u].name)}</strong><div class="meta">@${esc(p.u)} · ${ago(p.ts)}</div></div></div>
  <p>${tags(p.t)}</p>
  <div class="acts"><button data-like="${p.id}" class="${liked?'liked':''}" aria-pressed="${liked}">${liked?'♥':'♡'} ${p.likes.length}</button><button data-cmt="${p.id}">💬 ${p.c.length}</button>${p.u===S.me?`<button data-del="${p.id}" style="margin-left:auto">Delete</button>`:''}</div>
  <div class="cm hidden" id="cm${p.id}">${p.c.map(c=>`<div class="cmt"><strong>@${esc(c.u)}</strong> ${esc(c.t)}</div>`).join('')}
  <div class="cmtform"><input maxlength="140" placeholder="Write a comment" id="ci${p.id}"><button class="btn small" data-send="${p.id}">Reply</button></div></div></article>`;
}
$('#authForm').onsubmit=e=>{e.preventDefault();
  const u=$('#aUser').value.trim().toLowerCase();
  if(S.users[u]&&u!==S.me&&!confirm('That username exists. Log in as it?'))return;
  if(!S.users[u])S.users[u]={name:$('#aName').value.trim(),bio:$('#aBio').value.trim(),follows:[]};
  S.me=u;S.view='home';save();render();toast('Welcome to Ooru, '+S.users[u].name+'!')};
$('#logout').onclick=()=>{S.me=null;save();render()};
$('#nHome').onclick=()=>{S.view='home';render()};
$('#nMe').onclick=()=>{S.view='me';render()};
$('#postText').oninput=e=>$('#count').textContent=e.target.value.length+'/280';
$('#composer').onsubmit=e=>{e.preventDefault();const t=$('#postText').value.trim();
  if(!t)return toast('Write something first');
  S.posts.push({id:Date.now(),u:S.me,t,ts:Date.now(),likes:[],c:[]});
  $('#postText').value='';$('#count').textContent='0/280';save();render();toast('Posted')};
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const g=k=>b.dataset[k], P=id=>S.posts.find(p=>p.id==id);
  if(g('like')){const p=P(g('like')),i=p.likes.indexOf(S.me);i<0?p.likes.push(S.me):p.likes.splice(i,1);save();render()}
  else if(g('cmt')){$('#cm'+g('cmt')).classList.toggle('hidden')}
  else if(g('send')){const id=g('send'),v=$('#ci'+id).value.trim();if(!v)return;P(id).c.push({u:S.me,t:v});save();render();$('#cm'+id).classList.remove('hidden')}
  else if(g('del')){if(confirm('Delete this post?')){S.posts=S.posts.filter(p=>p.id!=g('del'));save();render();toast('Deleted')}}
  else if(g('follow')){const f=S.users[S.me].follows,u=g('follow'),i=f.indexOf(u);i<0?f.push(u):f.splice(i,1);save();render()}
});
render();
</script>
</body>
</html>
